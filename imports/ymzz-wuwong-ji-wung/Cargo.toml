[package]
name = "wuwong-ji-wung"
version = "0.1.0"
edition = "2021"
description = "本地優先知識記憶與子智能體協作平台"

[dependencies]
tauri = { version = "2", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tauri-plugin-store = { version = "2", features = ["all"] }

[dependencies.tauri-plugin-sql]
version = "2"
features = ["all"]

[profile.release]
strip = true
opt-level = 3
