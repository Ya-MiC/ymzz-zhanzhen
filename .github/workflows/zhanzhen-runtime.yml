name: Zhanzhen local runtime
on:
  push:
    branches: [master]
    paths-ignore: ['applications/dsh/**']
  pull_request:
    branches: [master]
    paths-ignore: ['applications/dsh/**']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo test --workspace --locked
      - run: cargo build -p ymzz-runtime-core --locked
      - run: npm ci --ignore-scripts
        working-directory: runtime
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir apps/ui test
      - run: pnpm --dir apps/ui build
      - run: npm run build --prefix runtime
      - run: npm test --prefix runtime
      - run: python3 scripts/integration/verify.py
      - run: python3 scripts/integration/license_check.py
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            runtime-desktop -> target
      - run: cargo build -p ymzz-runtime-core --locked
      - run: npm ci --ignore-scripts
        working-directory: runtime
      - run: npm ci --ignore-scripts
        working-directory: runtime-desktop
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir apps/ui test
      - run: pnpm --dir apps/ui build
      - run: npm run build --prefix runtime
      - run: npm test --prefix runtime
      - run: npm run build --prefix runtime-desktop
      - run: python scripts/integration/collect_notices.py
      - name: Fetch public Node license for redistribution
        run: Invoke-WebRequest https://raw.githubusercontent.com/nodejs/node/v24.22.1/LICENSE -OutFile runtime-desktop/node-LICENSE
      - run: node runtime-desktop/scripts/portable.mjs
      - name: Relocate portable app, launch real GUI and complete offline task through bundled Rust core
        shell: pwsh
        run: ./runtime-desktop/scripts/windows-smoke.ps1
      - name: Package only after executable smoke succeeds
        shell: pwsh
        run: Compress-Archive -Path dist/zhanzhen-portable/* -DestinationPath dist/ymzz-zhanzhen-windows-x64-portable.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zhanzhen-windows-proof
          path: dist/smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: zhanzhen-windows-x64-portable
          path: dist/ymzz-zhanzhen-windows-x64-portable.zip
