[workspace]
resolver = "2"
members = [
  "crates/ymzz-core",
  "crates/ymzz-pay",
  "crates/ymzz-redblue",
  "crates/ymzz-server",
  "crates/ymzz-runtime-core",
]
# "apps/desktop/src-tauri" 暫時排除（需完整 Tauri 工具鏈與網路，列為阻塞項）
exclude = []

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
