[package]
name = "ymzz-redblue"
version = "0.1.0"
edition = "2021"

# [阻塞項] rhai 不在本機快取，需網路取得。先以 stub 編譯。
# rhai = "1.8"

[dependencies]
ymzz-core = { path = "../ymzz-core" }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

[dev-dependencies]
