[package]
name = "ymzz-server"
version = "0.1.0"
edition = "2021"

# [阻塞項] tower-governor 與 reqwest 不在本機快取，需網路取得。
# tower-governor = "0.4"
# reqwest = { version = "0.12", features = ["json"] }

[dependencies]
ymzz-core = { path = "../ymzz-core" }
ymzz-pay = { path = "../ymzz-pay" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

[dev-dependencies]
