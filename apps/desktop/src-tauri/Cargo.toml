[package]
name = "ymzz-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "ymzz-desktop"
path = "src/main.rs"
